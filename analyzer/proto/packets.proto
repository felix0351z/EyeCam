syntax = "proto3";
package packets;

message YoloPacket {
  uint64 frame_id = 1;
  uint64 timestamp_ms = 2;
  bytes jpeg_bytes = 3;
  bytes confidences = 4;
  bytes class_ids = 5;
  bytes boxes = 6;
}

message SensorPacket {
  bytes distance_mm = 1;      // int16,  little endian, 64 Werte (8x8, Zeile für Zeile)
  bytes target_status = 2;    // uint8,  64 Werte
  bytes range_sigma_mm = 3;   // uint16, little endian, 64 Werte
}


// Geglättete Gefahrenwerte (0-1) der ZoneDetection, getrennt nach Quelle und Zone
enum GraphLabel {
  YOLO_LEFT = 0;
  YOLO_MIDDLE = 1;
  YOLO_RIGHT = 2;
  SENSOR_LEFT = 3;
  SENSOR_MIDDLE = 4;
  SENSOR_RIGHT = 5;
}

message GraphValue {
  GraphLabel name = 1;
  float value = 2;
}

message GraphPacket {
  uint64 frame_id = 1;
  repeated GraphValue graphs = 2;
}

message StatusPacket {
  bool running = 1;
}

// Richtung des Ausweichsignals, entspricht MoveDirection in der App
enum MoveDirection {
  MOVE_LEFT = 0;
  MOVE_RIGHT = 1;
  MOVE_STOP = 2;
}

// Ausweichsignal, wird bei jedem ausgelösten Signal der Detection gesendet
message MovePacket {
  MoveDirection direction = 1;
}

message Packet {
  oneof payload {
    YoloPacket yolo = 1;
    SensorPacket sensor = 2;
    GraphPacket graph = 3;
    StatusPacket status = 4;
    MovePacket move = 5;
  }
}

message Command {
  oneof payload {
    bool running = 1;
    bool shutdown = 2;
  }
}