[package]
name = "analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36.0"
egui_plot = "0.37.0"

bevy = "0.19.0"
bevy_egui = "0.42.0"

prost = "0.14.4"
zune-jpeg = "0.5.15"

# `zune-jpeg` package will be always built with optimizations
[profile.dev.package.zune-jpeg]
opt-level = 3


[build-dependencies]
prost-build = "0.14.4"
